# GitHub Actions workflow: a list of steps GitHub runs on its own computers.
# It has two jobs:
#   update - runs the Python script to download the latest reports, then commits data/ changes.
#   deploy - publishes the site (all the files in the repo) to GitHub Pages.

name: Update data and deploy

# When the workflow runs.
on:
  schedule:
    # Cron format: minute hour day-of-month month day-of-week, always in UTC.
    # GitHub may start scheduled runs late (sometimes by hours) when it is busy.
    - cron: "0 5 * * *"    # 05:00 UTC = 1 AM EDT in summer, midnight EST in winter
    - cron: "0 17 * * *"   # 17:00 UTC = 1 PM EDT in summer, noon EST in winter
  workflow_dispatch:        # "Run workflow" button in the Actions tab
    inputs:
      # A checkbox shown when you click "Run workflow". Leave it off normally. Tick it only
      # when the log shows a big drop in reports is real; it skips the safety check once.
      force:
        description: "Skip the safety check on sudden drops in report counts (--force)"
        type: boolean
        default: false
  push:
    branches: [main]        # redeploy when site code changes

# Only one run at a time; a new run waits for the current one instead of cancelling it,
# so two runs never try to commit data at once.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Only the schedule and the manual button pull new data; code pushes just redeploy.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Allows this job to push the data commit back to the repo.
    permissions:
      contents: write
    steps:
      # Download a copy of the repo onto the runner.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The login for the official API comes from the repo's secrets
      # (Settings > Secrets and variables > Actions), so it is never stored in the code.
      - name: Fetch reports and compare with previous data
        env:
          HPS_EMAIL: ${{ secrets.HPS_EMAIL }}
          HPS_PASSWORD: ${{ secrets.HPS_PASSWORD }}
        # Adds --force only when the checkbox above was ticked (scheduled runs never force).
        run: python3 scripts/fetch_and_diff.py ${{ inputs.force && '--force' || '' }}

      # Commit and push data/ only if something changed (git diff --cached --quiet
      # succeeds when there is nothing new, and the step stops there).
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update shortage data $(TZ=America/Toronto date +%F)"
          git push

  deploy:
    needs: update
    # Runs after a successful update, or on its own for code pushes (update skipped).
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Permissions GitHub Pages needs to publish the site.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # pick up the data commit made by the update job

      # Package the whole repo folder (path: .) as the website...
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # ...and publish it.
      - id: deployment
        uses: actions/deploy-pages@v5
