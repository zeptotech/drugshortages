name: Update data and deploy

on:
  schedule:
    - cron: "0 5 * * *"    # 05:00 UTC = 1 AM EDT in summer, midnight EST in winter
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # redeploy when site code changes

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # Only the schedule and the manual button pull new data; code pushes just redeploy.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch reports and compare with previous data
        env:
          HPS_EMAIL: ${{ secrets.HPS_EMAIL }}
          HPS_PASSWORD: ${{ secrets.HPS_PASSWORD }}
        run: python3 scripts/fetch_and_diff.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update shortage data $(TZ=America/Toronto date +%F)"
          git push

  deploy:
    needs: update
    # Runs after a successful update, or on its own for code pushes (update skipped).
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # pick up the data commit made by the update job

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
